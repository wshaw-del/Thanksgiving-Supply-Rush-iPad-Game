<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanksgiving Supply Rush — Wide-Angle Samples</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6efe5;color:#38291e;font:16px system-ui,-apple-system,sans-serif}header{background:#74412d;color:#fff;padding:16px;text-align:center}h2{margin:0 0 6px}main{max-width:1500px;margin:auto;padding:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0}select,button{font:inherit;padding:11px 14px;border-radius:9px;border:1px solid #9a8067}button{background:#31674e;color:#fff;font-weight:700}.status{text-align:center;font-weight:800;font-size:22px;margin:14px}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:8px}.picture{position:relative;touch-action:manipulation}.picture img{display:block;width:100%;border:2px solid #b39b7b;border-radius:8px}.marker{position:absolute;width:30px;height:30px;border:4px solid #22a45d;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 2px white}.note{text-align:center;margin:14px;color:#695b4b;font-size:14px}@media(max-width:650px){.pictures{grid-template-columns:1fr;gap:14px}.status{font-size:19px}}
</style></head><body><header><h2>Thanksgiving Supply Rush — Spot the Difference</h2>Three wide-angle realistic puzzle samples</header><main><div class="controls"><select id="theme" aria-label="Select theme"></select><button id="start">Start 60-second sample</button><button id="reset">Reset</button></div><div class="status" id="status">Select a theme and press Start</div><div class="pictures"><div class="picture" id="left"><img id="a" alt="Original picture"></div><div class="picture" id="right"><img id="b" alt="Changed picture"></div></div><p class="note">Find exactly three differences. Tap either image. No hints or answer reveals. This is a separate visual test, not the multiplayer game.</p></main><script>
const puzzles=[{"name": "Thanksgiving", "a": "p0a.jpg", "b": "p0b.jpg", "spots": [{"x": 0.2151, "y": 0.8089, "rx": 0.0747, "ry": 0.2361}, {"x": 0.3151, "y": 0.8289, "rx": 0.0608, "ry": 0.1761}, {"x": 0.9324, "y": 0.72, "rx": 0.0747, "ry": 0.325}]}, {"name": "City of Mobile", "a": "p1a.jpg", "b": "p1b.jpg", "spots": [{"x": 0.1363, "y": 0.1388, "rx": 0.0876, "ry": 0.1485}, {"x": 0.1743, "y": 0.5374, "rx": 0.0742, "ry": 0.23}, {"x": 0.8436, "y": 0.3062, "rx": 0.0976, "ry": 0.2234}]}, {"name": "Digital Forensics Lab", "a": "p2a.jpg", "b": "p2b.jpg", "spots": [{"x": 0.2441, "y": 0.7478, "rx": 0.0624, "ry": 0.2213}, {"x": 0.3955, "y": 0.7121, "rx": 0.0708, "ry": 0.2526}, {"x": 0.3223, "y": 0.8147, "rx": 0.0591, "ry": 0.1454}]}];let active=false,found=new Set(),end=0,timer=null;const $=id=>document.getElementById(id);puzzles.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=p.name;$('theme').append(o)});function clearMarks(){document.querySelectorAll('.marker').forEach(x=>x.remove())}function show(){const p=puzzles[+$('theme').value];$('a').src=p.a;$('b').src=p.b;clearMarks();active=false;found.clear();clearInterval(timer);$('status').textContent='Press Start to begin'}$('theme').onchange=show;$('reset').onclick=show;$('start').onclick=()=>{show();active=true;end=Date.now()+60000;timer=setInterval(()=>{let s=Math.max(0,Math.ceil((end-Date.now())/1000));$('status').textContent=`${s}s remaining • ${found.size}/3 found`;if(!s){active=false;clearInterval(timer);$('status').textContent=`Time’s up • ${found.size}/3 found`}},100)};['left','right'].forEach(id=>$(id).onclick=e=>{if(!active)return;let rect=$(id).getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;const p=puzzles[+$('theme').value];for(let i=0;i<p.spots.length;i++){const s=p.spots[i];if(found.has(i)||Math.abs(x-s.x)>s.rx||Math.abs(y-s.y)>s.ry)continue;found.add(i);['left','right'].forEach(k=>{let m=document.createElement('div');m.className='marker';m.style.left=(s.x*100)+'%';m.style.top=(s.y*100)+'%';$(k).append(m)});if(found.size===3){active=false;clearInterval(timer);$('status').textContent='Completed! 3/3 found'}else $('status').textContent=`${Math.ceil((end-Date.now())/1000)}s remaining • ${found.size}/3 found`;break}});show();</script></body></html>
