<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Spot the Difference – Approved Samples</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;background:#241813}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(160deg,#5b3828,#241813 60%)}
header{padding:12px 12px 6px;text-align:center} h1{margin:0;font-size:clamp(20px,4vw,30px)} p{margin:4px 0 0;color:#e7d2be}
main{max-width:1400px;margin:0 auto;padding:0 10px 16px}
.bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.bar label{font-weight:700}
select,button{font:inherit;padding:10px 13px;border-radius:10px;border:1px solid #b3977c} select{background:#fff;color:#241813} button{background:#2f8d69;color:#fff;font-weight:700} button.secondary{background:#6b5244}
.score{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffff14;border:1px solid #ffffff2e;padding:10px 14px;border-radius:11px;margin-bottom:10px;font-weight:700}.count{color:#ffd694}
.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.pane{min-width:0}.heading{text-align:center;font-size:14px;font-weight:800;letter-spacing:.04em;margin:0 0 5px}
.frame{touch-action:manipulation;position:relative;border-radius:12px;overflow:hidden;border:2px solid #f1ce93;background:#2a211c;line-height:0}.frame img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotmarker{position:absolute;transform:translate(-50%,-50%);height:28px;width:28px;border:4px solid #62ee9c;border-radius:50%;box-shadow:0 0 0 2px #151715,0 0 12px #4ce783;pointer-events:none}
.footer{text-align:center;font-size:13px;color:#e6d3c2;margin-top:10px}.reward{color:#ffe3aa;font-weight:800}
@media(max-width:570px){.images{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Spot the Difference – 3 Approved Samples</h1><p>Find all <strong>3 differences</strong> in 60 seconds. No hints. No answer reveal.</p></header>
<main>
<div class='bar'>
<label for='puzzle'>Puzzle:</label>
<select id='puzzle'>
<option value='0'>Thanksgiving</option>
<option value='1'>City of Mobile</option>
<option value='2'>Digital Forensics Lab</option>
</select>
<button id='start'>Start 60-Second Sample</button>
<button id='reset' class='secondary'>Reset</button>
</div>
<div class='score'><div>Time: <span id='time' class='count'>60</span>s</div><div>Found: <span id='found' class='count'>0 / 3</span></div><div id='status'>Tap the matching differences in either image.</div></div>
<div class='images'>
<div class='pane'><div class='heading'>Image A</div><div class='frame'><img id='imgA' alt='Image A'></div></div>
<div class='pane'><div class='heading'>Image B</div><div class='frame'><img id='imgB' alt='Image B'></div></div>
</div>
<div class='footer'>This is a standalone iPad test. <span class='reward'>Solo reward:</span> 1 random ingredient.</div>
</main>
<script>
'use strict';
const puzzles = [
 {title:'Thanksgiving',a:'p0a.jpg',b:'p0b.jpg',targets:[
  {x:.116,y:.46,rx:.095,ry:.14},
  {x:.595,y:.655,rx:.075,ry:.082},
  {x:.63,y:.802,rx:.090,ry:.092}]},
 {title:'City of Mobile',a:'p1a.jpg',b:'p1b.jpg',targets:[
  {x:.857,y:.250,rx:.105,ry:.045}, // street sign (Royal / Dauphin)
  {x:.342,y:.742,rx:.045,ry:.100}, // hydrant (yellow / silver)
  {x:.893,y:.390,rx:.065,ry:.064}  // changed parade mask/feathers
 ]},
 {title:'Digital Forensics Lab',a:'p2a.jpg',b:'p2b.jpg',targets:[
  {x:.455,y:.640,rx:.048,ry:.055}, // yellow evidence marker (3/5)
  {x:.548,y:.676,rx:.055,ry:.047}, // phone (black/white)
  {x:.341,y:.620,rx:.052,ry:.040}  // portable drive/USB accessory
 ]}
];
let active=0, found=new Set(),timer=null,remaining=60,running=false;
const $=id=>document.getElementById(id);
const sel=$('puzzle'), imgA=$('imgA'), imgB=$('imgB');
const frameA=imgA.parentElement, frameB=imgB.parentElement;
const timeEl=$('time'), foundEl=$('found'),statusEl=$('status');
function clearTimer(){if(timer!==null){clearInterval(timer);timer=null;}}
function clearMarkers(){document.querySelectorAll('.hotmarker').forEach(n=>n.remove());}
function updateFound(){foundEl.textContent=found.size+' / 3';}
function loadPuzzle(){clearTimer();running=false;found.clear();clearMarkers();active=Number(sel.value);const p=puzzles[active];imgA.src=p.a;imgB.src=p.b;remaining=60;timeEl.textContent='60';updateFound();statusEl.textContent='Tap the matching differences in either image.';}
function addMarker(frame,t){const m=document.createElement('div');m.className='hotmarker';m.style.left=(t.x*100)+'%';m.style.top=(t.y*100)+'%';frame.appendChild(m);}
function handleTap(ev,img){
 if(!running)return;
 const rect=img.getBoundingClientRect();
 if(rect.width===0||rect.height===0)return;
 const x=(ev.clientX-rect.left)/rect.width,y=(ev.clientY-rect.top)/rect.height;
 if(x<0||x>1||y<0||y>1)return;
 const targets=puzzles[active].targets;
 for(let i=0;i<targets.length;i++){
  if(found.has(i))continue;
  const t=targets[i];
  if(Math.abs(x-t.x)<=t.rx && Math.abs(y-t.y)<=t.ry){
   found.add(i);addMarker(frameA,t);addMarker(frameB,t);updateFound();
   if(found.size===3){running=false;clearTimer();statusEl.textContent='Success! All 3 found.';}
   ev.preventDefault();return;
  }
 }
}
// Events belong on the frame, not the image; the image is intentionally noninteractive.
frameA.addEventListener('pointerdown',ev=>handleTap(ev,imgA));
frameB.addEventListener('pointerdown',ev=>handleTap(ev,imgB));
function start(){clearTimer();found.clear();clearMarkers();updateFound();remaining=60;timeEl.textContent='60';running=true;statusEl.textContent='Game in progress…';timer=setInterval(()=>{if(!running)return;remaining--;timeEl.textContent=String(remaining);if(remaining<=0){running=false;clearTimer();statusEl.textContent="Time's up! No answer reveal.";}},1000);}
sel.addEventListener('change',loadPuzzle);
$('start').addEventListener('click',start);
$('reset').addEventListener('click',loadPuzzle);
loadPuzzle();
</script></body></html>
